# This docker-compose is only to get started with the Conduktor Gateway Community Edition.
#
####################################################################################################
# DO NOT USE IT IN PRODUCTION
#
# For production, please check: https://docs.conduktor.io/platform/category/deployment-options/
#   to deploy on Kubernetes via Helm, or AWS using Cloudformation.
####################################################################################################
#
# Demo credentials (NOT for production): admin / admin-secret (used by the infrastructure),
# and two consumer principals, consumer-a / consumer-a-secret and consumer-b / consumer-b-secret.
# These appear in several places below (broker JAAS, the broker healthcheck, the Gateway, the
# data generator) and in demo.sh. Change them together.
# ACLs are enabled but all users are superusers, so this demo is effectively allow-all, and
# Kafka data is ephemeral (no volume). Both are intentional for a throwaway local demo.
#
# Network layout (three isolated Docker networks standing in for VPCs):
#
#   cluster-vpc   the private Kafka cluster. Nothing here is published to your laptop.
#   client-vpc-a  a client "VPC". Has NO route to cluster-vpc.
#   client-vpc-b  a second client "VPC". Also no route to cluster-vpc, and none to client-vpc-a.
#
# Only the Gateway is attached to all three, so it is the single bridge. A client in
# client-vpc-a or client-vpc-b literally cannot resolve or reach `kafka` directly; the
# only way to the cluster is through the Gateway. The cluster keeps ONE attachment
# (the Gateway on cluster-vpc) no matter how many client VPCs reach in.
services:
  # Single-node Kafka in KRaft combined mode: one process is both broker and
  # controller, so there is no separate controller container. Lives only on
  # cluster-vpc, so it is unreachable from the client VPCs and from your laptop.
  kafka:
    image: apache/kafka:4.0.0
    hostname: kafka
    container_name: kafka
    networks: [cluster-vpc]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "DOCKER:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT"
      KAFKA_LISTENERS: "DOCKER://kafka:9092,CONTROLLER://kafka:9093"
      KAFKA_ADVERTISED_LISTENERS: "DOCKER://kafka:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: "User:admin;User:consumer-a;User:consumer-b"
      # SASL/PLAIN wiring
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_CONTROLLER_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: |
        org.apache.kafka.common.security.plain.PlainLoginModule required \
        username="admin" \
        password="admin-secret" \
        user_admin="admin-secret";
      KAFKA_LISTENER_NAME_DOCKER_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_DOCKER_PLAIN_SASL_JAAS_CONFIG: |
        org.apache.kafka.common.security.plain.PlainLoginModule required \
        username="admin" \
        password="admin-secret" \
        user_admin="admin-secret" \
        user_consumer-a="consumer-a-secret" \
        user_consumer-b="consumer-b-secret";
      # Single-node demo sizing
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
    healthcheck:
      # Real readiness: authenticate and fetch API versions, not just a TCP port probe.
      test:
        - CMD-SHELL
        - >-
          { echo 'security.protocol=SASL_PLAINTEXT';
          echo 'sasl.mechanism=PLAIN';
          echo 'sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret";';
          } > /tmp/hc.properties &&
          /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 --command-config /tmp/hc.properties >/dev/null 2>&1 || exit 1
      interval: 15s
      timeout: 15s
      retries: 15
      start_period: 30s

  schema-registry:
    image: ghcr.io/aiven-open/karapace:4.1.0
    container_name: karapace
    # Multi-homed onto the client VPCs too, so the consumers can fetch schemas to decode Avro.
    # Kafka stays reachable only through the Gateway; the registry is reachable directly, as it
    # commonly is in real deployments.
    networks: [cluster-vpc, client-vpc-a, client-vpc-b]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${SR_PORT:-8081}:8081"
    command: ["/opt/karapace/start.sh", "registry"]
    environment:
      KARAPACE_ADVERTISED_HOSTNAME: schema-registry
      KARAPACE_BOOTSTRAP_URI: kafka:9092
      KARAPACE_PORT: 8081
      KARAPACE_HOST: 0.0.0.0
      KARAPACE_CLIENT_ID: karapace
      KARAPACE_GROUP_ID: karapace-registry
      KARAPACE_MASTER_ELIGIBILITY: "true"
      KARAPACE_TOPIC_NAME: _schemas
      KARAPACE_COMPATIBILITY: BACKWARD
      KARAPACE_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KARAPACE_SASL_MECHANISM: PLAIN
      KARAPACE_SASL_PLAIN_USERNAME: admin
      KARAPACE_SASL_PLAIN_PASSWORD: admin-secret
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://localhost:8081/_health'').status==200 else 1)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  conduktor-data-generator:
    image: conduktor/conduktor-data-generator:0.10.0
    container_name: conduktor-data-generator
    networks: [cluster-vpc]
    environment:
      KAFKA_SCHEMA_REGISTRY_URL: http://karapace:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret";'
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy

  # The single bridge. Attached to the private cluster AND both client VPCs, so it is
  # the only path from any client network to Kafka. The cluster sees one attachment.
  conduktor-gateway:
    image: conduktor/conduktor-gateway:3.19.1
    hostname: conduktor-gateway
    container_name: conduktor-gateway
    networks: [cluster-vpc, client-vpc-a, client-vpc-b]
    ports:
      - "${GATEWAY_ADMIN_PORT:-8888}:8888" # Gateway admin / health API
    environment:
      GATEWAY_LICENSE_KEY: ${GATEWAY_LICENSE_KEY:?set GATEWAY_LICENSE_KEY, or put it in a .env file}
      GATEWAY_MIN_BROKERID: 1

      # Backing Kafka: the private cluster the Gateway proxies for (reached on cluster-vpc).
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret";

      # Multi-listener mode requires these to be explicit (Gateway does not infer them).
      GATEWAY_SECURITY_MODE: KAFKA_MANAGED # forward client SASL to Kafka; Kafka stays the auth authority
      GATEWAY_ACL_ENABLED: "false" # Kafka manages authorization

      # Single listener, reached from inside the client VPCs at conduktor-gateway:9092.
      # advertised host = container name, advertised port = local port (no NAT on the Docker network).
      GATEWAY_LISTENER_DOCKER_SECURITY_PROTOCOL: SASL_PLAINTEXT
      GATEWAY_LISTENER_DOCKER_ROUTING: port
      GATEWAY_LISTENER_DOCKER_PORTS: 9092
      GATEWAY_LISTENER_DOCKER_ADVERTISED_HOST: conduktor-gateway

      # Keep the demo's topic list clean and single-broker friendly.
      GATEWAY_FEATURE_FLAGS_AUDIT: "false"
      GATEWAY_TOPIC_STORE_KCACHE_REPLICATION_FACTOR: 1
      GATEWAY_DATA_QUALITY_TOPIC_REPLICATION_FACTOR: 1

      # Surface the broker-address rewrite in the logs so you can watch it happen.
      LOG4J2_IO_CONDUKTOR_PROXY_REBUILDER_COMPONENTS_LEVEL: debug
    healthcheck:
      test: curl --fail --silent http://localhost:8888/health/ready --output /dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      kafka:
        condition: service_healthy

  # Consumer in the first VPC (principal: consumer-a). No route to cluster-vpc; it reaches Kafka
  # only through the Gateway. kcat decodes Avro via Karapace. Credentials are passed inline by
  # demo.sh, so nothing sensitive is baked into the container. It sleeps so you can `docker exec` it.
  kafka-consumer-a:
    image: edenhill/kcat:1.7.1
    platform: linux/amd64
    hostname: kafka-consumer-a
    container_name: kafka-consumer-a
    networks: [client-vpc-a]
    entrypoint: ["tail", "-f", "/dev/null"] # keep the container alive for `docker exec`
    depends_on:
      conduktor-gateway:
        condition: service_healthy

  # Consumer in a SECOND, separate VPC (principal: consumer-b). Proves the fan-in: another isolated
  # client network reaching the same cluster through the same Gateway. It cannot reach kafka
  # directly, nor the consumer in client-vpc-a.
  kafka-consumer-b:
    image: edenhill/kcat:1.7.1
    platform: linux/amd64
    hostname: kafka-consumer-b
    container_name: kafka-consumer-b
    networks: [client-vpc-b]
    entrypoint: ["tail", "-f", "/dev/null"] # keep the container alive for `docker exec`
    depends_on:
      conduktor-gateway:
        condition: service_healthy

networks:
  cluster-vpc: # the private Kafka cluster
  client-vpc-a: # client VPC #1, no route to the cluster
  client-vpc-b: # client VPC #2, no route to the cluster or to VPC #1
